server:
  port: ${SERVER_PORT:8083}
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: won-invest-channel-server

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  health:
    neo4j:
      enabled: false

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

logging:
  structured:
    format:
      console: logstash
  error-log:
    retention-days: 7

features:
  aidb:
    enabled: false
  neo4j:
    enabled: false

internal:
  service-id: won-invest-channel
  api-key: ${INTERNAL_API_KEY}
  allowed-service-ids: won-admin,won-ai-server, won-card-channel
  services:
    invest-core:
      base-url: ${INVEST_CORE_BASE_URL:http://dummy-invest-core:8080}
    common:
      base-url: ${COMMON_BASE_URL:http://dummy-common:8080}

admin:
  api-token: ${ADMIN_API_TOKEN}

aws:
  sqs:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${AWS_SQS_ENDPOINT:}
    sweep-request-queue-url: ${SQS_SWEEP_REQUEST_QUEUE_URL}
    sweep-result-queue-url: ${SQS_SWEEP_RESULT_QUEUE_URL}

sweep:
  consumer:
    enabled: ${SWEEP_CONSUMER_ENABLED:false}
    max-messages: 10
    wait-time-seconds: ${SWEEP_CONSUMER_WAIT_TIME_SECONDS:10}
    processing-timeout-seconds: 300
    worker-count: 8

  outbox:
    publisher:
      enabled: ${SWEEP_OUTBOX_PUBLISHER_ENABLED:false}
      batch-size: 500
      max-retry-count: 5
      fixed-delay-ms: 10000
      message-group-shard-count: 64

  batch:
    reservation-size: 500

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

external:
  kis:
    base-url: ${KIS_BASE_URL}
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}
    access-token: ${KIS_ACCESS_TOKEN}
