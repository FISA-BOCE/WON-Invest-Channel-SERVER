server:
  port: 8083

spring:
  application:
    name: won-invest-channel-server
  datasource:
    url: jdbc:mysql://localhost:13306/won_invest_channel_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: won_user
    password: won_local_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  security:
    jwt-secret: won-invest-channel-jwt-secret-key-32chars!!
    access-token-expiration-seconds: 3600

feign:
  common-server-url: http://localhost:8080
  invest-core:
    url: http://localhost:8084

internal:
  channel:
    service-id: won-channel
    allowed-service-id: won-channel
    api-key: test-internal-api-key

aws:
  sqs:
    region: ap-northeast-2
    endpoint: http://localhost:4566
    sweep-request-queue-url: http://sqs.ap-northeast-2.localhost.localstack.cloud:4566/000000000000/won-card-sweep-request-queue.fifo
    sweep-result-queue-url: http://sqs.ap-northeast-2.localhost.localstack.cloud:4566/000000000000/won-invest-sweep-result-queue.fifo

sweep:
  consumer:
    enabled: false
    fixed-delay-ms: 10000
    max-messages: 10
    wait-time-seconds: 5
    processing-timeout-seconds: 300
  outbox:
    publisher:
      enabled: false
      batch-size: 20
      max-retry-count: 5
      fixed-delay-ms: 10000
