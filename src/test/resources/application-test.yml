spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

jwt:
  secret: test-jwt-secret-key-must-be-at-least-32-chars!!

feign:
  common-server-url: ${COMMON_SERVER_URL:http://localhost:18080}
